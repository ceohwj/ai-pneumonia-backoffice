<div class="card email-log-card">
    <div class="admin-page-heading">
        <div>
            <p class="admin-eyebrow">ADMIN CONSOLE</p>
            <h2>Email 전송로그</h2>
            <p>Celery 이메일 작업의 처리 상태와 실패 원인을 확인합니다.</p>
        </div>
        <button class="secondary" onclick="pages.renderAdminEmailLogs()">새로고침</button>
    </div>

    <div class="search-bar email-log-filters">
        <input
            type="text"
            id="email-log-query"
            placeholder="수신 이메일 또는 제목 검색"
            onkeypress="if(event.key === 'Enter') pages.handleEmailLogSearch()"
        >
        <select id="email-log-status" onchange="pages.handleEmailLogSearch()">
            <option value="">상태 전체</option>
            <option value="PENDING">대기</option>
            <option value="STARTED">전송 중</option>
            <option value="SUCCESS">성공</option>
            <option value="FAILURE">실패</option>
        </select>
        <button onclick="pages.handleEmailLogSearch()">검색</button>
        <button class="secondary" onclick="pages.resetEmailLogSearch()">초기화</button>
    </div>

    <div class="email-log-table-wrap">
        <table class="email-log-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>진료기록</th>
                    <th>요청자</th>
                    <th>수신 이메일</th>
                    <th>제목</th>
                    <th class="email-log-status">상태</th>
                    <th>재시도</th>
                    <th>요청 일시</th>
                    <th>완료 일시</th>
                    <th>결과</th>
                    <th>오류</th>
                </tr>
            </thead>
            <tbody id="email-log-list"></tbody>
        </table>
    </div>
</div>
