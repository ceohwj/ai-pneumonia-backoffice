[project]
name = "ai-health-web-assignment"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
app = [
    "alembic>=1.18.4",
    "asyncmy>=0.2.11",
    "celery[redis]>=5.5.0",
    "cryptography>=46.0.6",
    "fastapi[standard]>=0.135.3",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.13.1",
    "pyjwt>=2.13.0",
    "pymysql>=1.1.1",
    "redis>=6.4.0",
    "sqlalchemy[asyncio]>=2.0.49",
    "uuid6>=2025.0.1",
]
ai = [
    "numpy>=2.2.0",
    "opencv-python-headless>=4.11.0.86",
    "pillow>=11.1.0",
    "redis>=6.4.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux'" },
]

[dependency-groups]
dev = [
    "locust>=2.45.0",
]
