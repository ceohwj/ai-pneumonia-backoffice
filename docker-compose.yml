services:
  fastapi:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      TZ: Asia/Seoul
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      REDIS_URL: redis://redis:6379/2
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--reload",
        "--reload-dir",
        "/app/app",
      ]
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./static:/app/static
      - ./alembic:/app/alembic
      - ./alembic.ini:/app/alembic.ini:ro
      - media_volume:/app/media
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/healthcheck || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: .
      dockerfile: app/Dockerfile
    env_file:
      - .env
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      TZ: Asia/Seoul
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    command:
      [
        "celery",
        "-A",
        "app.celery_worker.celery_app",
        "worker",
        "--loglevel=INFO",
        "--queues=email_queue",
        "--concurrency=1",
      ]
    volumes:
      - ./app:/app/app
      - media_volume:/app/media
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "celery -A app.celery_worker.celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong",
        ]
      interval: 10s
      timeout: 10s
      retries: 3
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy

  ai-worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      TZ: Asia/Seoul
      REDIS_URL: redis://redis:6379/2
      MEDIA_ROOT: /app/media
      PREDICTION_TASK_STREAM: prediction:tasks
      PREDICTION_CONSUMER_GROUP: prediction-workers
      PREDICTION_CLAIM_IDLE_MS: 300000
      PREDICTION_RESULT_TTL_SECONDS: 300
    volumes:
      - ./worker:/app/worker
      - media_volume:/app/media
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from worker.redis_client import redis_client; assert redis_client.ping()",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    command: ["--default-time-zone=+09:00"]
    volumes:
      - mysql_volume:/var/lib/mysql
      - ./mysql/conf.d/charset.cnf:/etc/mysql/conf.d/charset.cnf:ro
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: Asia/Seoul
    ports:
      - "3307:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 5s
      timeout: 20s
      retries: 5

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_volume:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5


volumes:
  mysql_volume:
  media_volume:
  redis_volume:
